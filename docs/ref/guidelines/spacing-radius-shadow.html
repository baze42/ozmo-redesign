<!-- @dsCard group="Spacing" viewport="700x150" name="Radius & shadow" subtitle="Soft warm corners and navy-tinted elevation" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;background:var(--bg-page);padding:22px 26px;font-family:var(--font-body);display:flex;gap:30px}
.grp{display:flex;gap:14px;align-items:flex-end}
.b{width:70px;height:70px;background:var(--paper);border:1px solid var(--border-subtle);display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-size:10px;color:var(--text-muted)}
.sh{width:80px;height:70px;background:var(--paper);border-radius:12px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-size:10px;color:var(--text-muted)}
.lbl{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--navy);margin-bottom:10px}
</style></head><body>
<div><div class="lbl">Radius</div><div class="grp">
<div class="b" style="border-radius:6px">sm 6</div>
<div class="b" style="border-radius:10px">md 10</div>
<div class="b" style="border-radius:16px">lg 16</div>
<div class="b" style="border-radius:24px">xl 24</div>
<div class="b" style="border-radius:999px">pill</div>
</div></div>
<div><div class="lbl">Shadow</div><div class="grp">
<div class="sh" style="box-shadow:var(--shadow-sm)">sm</div>
<div class="sh" style="box-shadow:var(--shadow-md)">md</div>
<div class="sh" style="box-shadow:var(--shadow-lg)">lg</div>
<div class="sh" style="box-shadow:var(--shadow-terra)">terra</div>
</div></div>
</body></html>
