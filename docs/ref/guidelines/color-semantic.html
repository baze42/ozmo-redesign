<!-- @dsCard group="Colors" viewport="700x130" name="Semantic colors" subtitle="Status: success, warning, danger, info" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;background:var(--bg-page);font-family:var(--font-body);padding:20px}
.row{display:flex;gap:12px}
.sw{flex:1;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-xs)}
.top{height:56px}.cap{padding:8px 10px;background:var(--paper)}
.cap b{display:block;font-size:12px;font-weight:700;color:var(--ink)}.cap span{font-size:10px;color:var(--text-muted)}
</style></head><body>
<div class="row">
<div class="sw"><div class="top" style="background:var(--success)"></div><div class="cap"><b>Success</b><span>#3F7D54</span></div></div>
<div class="sw"><div class="top" style="background:var(--warning)"></div><div class="cap"><b>Warning</b><span>#C1622D</span></div></div>
<div class="sw"><div class="top" style="background:var(--danger)"></div><div class="cap"><b>Danger</b><span>#B23B30</span></div></div>
<div class="sw"><div class="top" style="background:var(--info)"></div><div class="cap"><b>Info</b><span>#2C4D76</span></div></div>
</div>
</body></html>
