<!-- @dsCard group="Brand" viewport="700x220" name="Logo variations" subtitle="Full color, knockout, and mono lockups" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;background:var(--bg-page);padding:16px;font-family:var(--font-body)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border-radius:var(--radius-md);height:88px;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:var(--shadow-xs);overflow:hidden}
.tile img{height:44px}
.tile .t{position:absolute;left:10px;bottom:7px;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.6}
</style></head><body>
<div class="grid">
<div class="tile" style="background:var(--cream)"><img src="../assets/ozmo-logo-full.png"><span class="t" style="color:var(--navy)">Full color / cream</span></div>
<div class="tile" style="background:var(--navy)"><img src="../assets/ozmo-logo-cream.png"><span class="t" style="color:var(--cream)">Knockout / navy</span></div>
<div class="tile" style="background:var(--paper)"><img src="../assets/ozmo-logo-navy.png"><span class="t" style="color:var(--navy)">Mono navy</span></div>
<div class="tile" style="background:var(--terracotta)"><img src="../assets/ozmo-logo-cream.png"><span class="t" style="color:var(--cream)">Knockout / terracotta</span></div>
</div>
</body></html>
