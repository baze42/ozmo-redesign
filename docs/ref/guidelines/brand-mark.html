<!-- @dsCard group="Brand" viewport="700x180" name="The mark & clear space" subtitle="Standalone o/d loop for avatars, favicons, badges" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;background:var(--bg-page);padding:20px;font-family:var(--font-body);display:flex;gap:26px;align-items:center}
.mark{width:96px;height:96px;border-radius:var(--radius-lg);background:var(--paper);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);position:relative}
.mark img{height:56px}
.cs{outline:2px dashed var(--terracotta);outline-offset:0}
.txt{max-width:340px}
.txt h4{margin:0 0 6px;font-family:var(--font-display);font-weight:600;font-size:20px;color:var(--navy)}
.txt p{margin:0;font-size:13px;line-height:1.5;color:var(--ink-600)}
.small{width:40px;height:40px}.small img{height:24px}
.row{display:flex;gap:12px;align-items:center}
</style></head><body>
<div class="row">
<div class="mark"><img src="../assets/ozmo-mark.png"></div>
<div class="mark cs" style="width:72px;height:72px"><img src="../assets/ozmo-mark.png" style="height:40px"></div>
<div class="mark small" style="background:var(--navy)"><img src="../assets/ozmo-mark.png"></div>
</div>
<div class="txt"><h4>The loop mark</h4><p>The gradient "o/d" ring stands alone as an app icon, favicon, or avatar. Keep clear space of at least one ring-width on all sides; never crop or recolor the gradient.</p></div>
</body></html>
