<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;background:var(--bg-page);padding:22px 26px;font-family:var(--font-body)}
.row{display:flex;align-items:flex-end;gap:14px}
.item{display:flex;flex-direction:column;align-items:center;gap:6px}
.bar{background:var(--terracotta);border-radius:4px;width:100%}
.item span{font-size:10px;color:var(--text-muted)}
.item b{font-size:11px;color:var(--navy)}
.w{display:flex;flex-direction:column;align-items:center;gap:4px}
</style></head><body>
<div class="row">
<div class="w"><div class="item" style="width:24px"><div class="bar" style="height:4px"></div></div><b>1</b><span>4</span></div>
<div class="w"><div class="item" style="width:24px"><div class="bar" style="height:8px"></div></div><b>2</b><span>8</span></div>
<div class="w"><div class="item" style="width:24px"><div class="bar" style="height:12px"></div></div><b>3</b><span>12</span></div>
<div class="w"><div class="item" style="width:24px"><div class="bar" style="height:16px"></div></div><b>4</b><span>16</span></div>
<div class="w"><div class="item" style="width:24px"><div class="bar" style="height:24px"></div></div><b>5</b><span>24</span></div>
<div class="w"><div class="item" style="width:24px"><div class="bar" style="height:32px"></div></div><b>6</b><span>32</span></div>
<div class="w"><div class="item" style="width:24px"><div class="bar" style="height:48px"></div></div><b>7</b><span>48</span></div>
<div class="w"><div class="item" style="width:24px"><div class="bar" style="height:64px"></div></div><b>8</b><span>64</span></div>
<div class="w"><div class="item" style="width:24px"><div class="bar" style="height:88px"></div></div><b>9</b><span>96</span></div>
</div>
</body></html>
