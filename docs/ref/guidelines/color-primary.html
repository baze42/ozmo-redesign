<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;background:var(--bg-page);font-family:var(--font-body);padding:20px}
.row{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm)}
.sw{flex:1;height:104px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px}
.sw b{font-size:12px;font-weight:700;letter-spacing:.02em}
.sw span{font-size:11px;opacity:.8;font-variant-numeric:tabular-nums}
</style></head><body>
<div class="row">
<div class="sw" style="background:var(--navy-900);color:#fff"><b>navy-900</b><span>#132741</span></div>
<div class="sw" style="background:var(--navy-800);color:#fff"><b>navy-800</b><span>#1A3251</span></div>
<div class="sw" style="background:var(--navy);color:#fff"><b>navy · PRIMARY</b><span>#1F3A5F</span></div>
<div class="sw" style="background:var(--navy-600);color:#fff"><b>navy-600</b><span>#2C4D76</span></div>
<div class="sw" style="background:var(--navy-300);color:var(--navy-900)"><b>navy-300</b><span>#8BA1BD</span></div>
<div class="sw" style="background:var(--navy-100);color:var(--navy-900)"><b>navy-100</b><span>#D7DFEA</span></div>
</div>
</body></html>
