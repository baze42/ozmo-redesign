<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;background:#ded4c4;font-family:var(--font-body);padding:18px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.tile{border-radius:var(--radius-lg);padding:18px;min-height:120px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow-sm)}
.tile h4{margin:0;font-family:var(--font-display);font-weight:600;font-size:19px}
.tile p{margin:0;font-size:12px;line-height:1.4}
.tag{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
</style></head><body>
<div class="grid">
<div class="tile" style="background:var(--cream)"><div class="tag" style="color:var(--terracotta)">Default</div><h4 style="color:var(--navy)">Cream page</h4><p style="color:var(--ink)">The everyday canvas. Warm, calm, low-glare — 80% of all surfaces.</p></div>
<div class="tile" style="background:var(--navy)"><div class="tag" style="color:var(--terracotta-400)">Anchor</div><h4 style="color:var(--cream)">Navy block</h4><p style="color:var(--navy-100)">Headers, footers, feature bands. Grounds the page, sets contrast.</p></div>
<div class="tile" style="background:var(--paper)"><div class="tag" style="color:var(--terracotta)">Raised</div><h4 style="color:var(--navy)">Paper card</h4><p style="color:var(--ink)">Cards & panels lifted just off the cream with a soft warm shadow.</p></div>
</div>
</body></html>
