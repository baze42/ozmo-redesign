<!-- @dsCard group="Colors" viewport="700x160" name="Spark accent + neutrals" subtitle="Energy orange from the mark; warm cream/ink neutrals" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;background:var(--bg-page);font-family:var(--font-body);padding:20px}
.grid{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-xs)}
.sw{flex:1;height:60px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px}
.sw b{font-size:11px;font-weight:700}.sw span{font-size:10px;opacity:.85}
.lbl{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);margin:0 0 2px}
</style></head><body>
<div class="grid">
<div><div class="lbl">Energy</div><div class="row">
<div class="sw" style="background:var(--spark);color:#fff"><b>spark</b><span>#F05000</span></div>
<div class="sw" style="background:var(--spark-400);color:#fff"><b>spark-400</b><span>#FF7433</span></div>
</div></div>
<div><div class="lbl">Neutrals</div><div class="row">
<div class="sw" style="background:var(--cream);color:var(--ink)"><b>cream · BG</b><span>#F5EFE6</span></div>
<div class="sw" style="background:var(--cream-300);color:var(--ink)"><b>cream-300</b><span>#E6DCCB</span></div>
<div class="sw" style="background:var(--paper);color:var(--ink)"><b>paper</b><span>#FBF8F2</span></div>
<div class="sw" style="background:var(--ink-400);color:#fff"><b>ink-400</b><span>#847D75</span></div>
<div class="sw" style="background:var(--ink);color:var(--cream)"><b>ink · TEXT</b><span>#2A2725</span></div>
</div></div>
</div>
</body></html>
