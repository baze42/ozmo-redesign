<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;background:var(--bg-page);font-family:var(--font-body);padding:20px}
.row{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm)}
.sw{flex:1;height:104px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px}
.sw b{font-size:12px;font-weight:700}.sw span{font-size:11px;opacity:.85}
</style></head><body>
<div class="row">
<div class="sw" style="background:var(--terracotta-700);color:#fff"><b>terra-700</b><span>#8F4519</span></div>
<div class="sw" style="background:var(--terracotta-600);color:#fff"><b>terra-600</b><span>#A5521F</span></div>
<div class="sw" style="background:var(--terracotta);color:#fff"><b>terracotta · SECONDARY</b><span>#C1622D</span></div>
<div class="sw" style="background:var(--terracotta-400);color:var(--terracotta-700)"><b>terra-400</b><span>#D3844F</span></div>
<div class="sw" style="background:var(--terracotta-200);color:var(--terracotta-700)"><b>terra-200</b><span>#EABFA2</span></div>
<div class="sw" style="background:var(--terracotta-100);color:var(--terracotta-700)"><b>terra-100</b><span>#F4DCC9</span></div>
</div>
</body></html>
