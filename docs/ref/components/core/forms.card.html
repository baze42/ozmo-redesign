<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>
body{margin:0;background:var(--bg-page);padding:24px;font-family:var(--font-body)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 28px;max-width:640px}
.col{display:flex;flex-direction:column;gap:14px}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head><body>
<div id="root"></div>
<script type="text/babel">
const { Input, Checkbox, Switch } = window.OZMODigitalDesignSystem_5d9d0c;
function Demo(){
  const [a,setA]=React.useState(true);const [b,setB]=React.useState(false);const [on,setOn]=React.useState(true);
  return (
    <div className="grid">
      <div className="col">
        <Input label="Work email" placeholder="you@business.com" hint="We'll never share it." />
        <Input label="Website" defaultValue="not-a-url" error="Please enter a valid URL." />
      </div>
      <div className="col">
        <Checkbox label="Send me the monthly tips email" checked={a} onChange={e=>setA(e.target.checked)} />
        <Checkbox label="Add managed maintenance" checked={b} onChange={e=>setB(e.target.checked)} />
        <Switch label="Auto-updates on" checked={on} onChange={setOn} />
        <Switch label="Disabled" checked={false} disabled />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body></html>
